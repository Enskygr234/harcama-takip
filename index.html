<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Harcama Takip</title>
<meta name="description" content="Proje bazlı gelir/gider takibi ve günlük notlar. Veriler cihazınızda saklanır.">
<meta name="theme-color" content="#dfe2de" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111821" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Harcama">
<style>
  /* Şantiye defteri: beton zemin, kâğıt sayfalar, lacivert mürekkep, baret sarısı */
  :root {
    --beton:#dfe2de; --kagit:#fbfbf7; --murekkep:#15233b; --soluk:#5b6678; --cizgi:#cdd2cc;
    --sari:#f5b700; --sari-koyu:#d99e00; --gelir:#1b7a4b; --gider:#c2362b; --kenar:#e2857c;
    --dar:"Roboto Condensed","sans-serif-condensed","Arial Narrow","Helvetica Neue Condensed",system-ui,sans-serif;
    --govde:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --beton:#111821; --kagit:#1a2330; --murekkep:#e9edf1; --soluk:#9aa6b6; --cizgi:#2e3a4a; --gelir:#4cc38a; --gider:#ff7b6b; --kenar:#7d3b36; }
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; font-family:var(--govde); background:var(--beton); color:var(--murekkep); line-height:1.4;
         padding:calc(18px + env(safe-area-inset-top)) 14px calc(40px + env(safe-area-inset-bottom)); }
  main { max-width:620px; margin:0 auto; }
  :focus-visible { outline:3px solid var(--sari); outline-offset:2px; }
  [hidden] { display:none !important; }

  .ust { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; }
  h1 { margin:0; font:800 1.7rem/1 var(--dar); letter-spacing:.01em; }
  h2 { margin:0; font:700 1.2rem/1.2 var(--dar); }

  button { font:inherit; color:inherit; cursor:pointer; border:0; background:none; -webkit-tap-highlight-color:transparent; }
  .btn { min-height:46px; padding:0 18px; border-radius:10px; font-weight:700; background:var(--sari); color:#15233b; }
  .btn:active { background:var(--sari-koyu); }
  .btn.ikincil { background:transparent; color:var(--murekkep); border:1.5px solid var(--cizgi); font-weight:600; }
  .btn.tehlike { background:var(--gider); color:#fff; }
  .btn.kucuk { min-height:38px; padding:0 12px; font-size:.9rem; }

  /* Defter ayraçları gibi proje sekmeleri: seçili sekme sayfayla birleşir */
  .sekmeler { display:flex; align-items:flex-end; gap:4px; overflow-x:auto; padding:0 2px; scrollbar-width:none; position:relative; z-index:1; }
  .sekmeler::-webkit-scrollbar { display:none; }
  .sekme { flex:none; height:40px; padding:0 15px; border-radius:10px 10px 0 0; font:600 1rem/1 var(--dar); color:var(--soluk);
           background:color-mix(in srgb, var(--kagit) 45%, var(--beton)); border:1px solid var(--cizgi); border-bottom:0; }
  .sekme.secili { height:46px; background:var(--kagit); color:var(--murekkep); font-weight:800; box-shadow:inset 0 4px 0 var(--sari); }
  .sekme.yeni { background:transparent; border-style:dashed; }

  .sayfa { background:var(--kagit); border:1px solid var(--cizgi); border-radius:6px; padding:18px 16px; margin-bottom:14px; }
  .sayfa.ilk { border-top-left-radius:0; margin-top:-1px; }
  .baslik { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:12px; }
  .baslik h2 { white-space:nowrap; }
  .baslik.dar { margin-bottom:4px; min-height:38px; }

  /* Bakiye: defterin dip toplamı */
  .bakiye-ad { color:var(--soluk); font-size:.95rem; }
  .bakiye { font:800 clamp(2.4rem,12vw,3.4rem)/1.05 var(--dar); font-variant-numeric:tabular-nums; letter-spacing:-.01em; margin:2px 0 14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bakiye.eksi { color:var(--gider); }
  .ikili { display:grid; grid-template-columns:1fr 1fr; border-top:2px solid var(--murekkep); }
  .ikili > div { padding:10px 0 0; min-width:0; }
  .ikili > div + div { padding-left:14px; border-left:1px solid var(--cizgi); }
  .ikili small { display:block; color:var(--soluk); font-size:.9rem; }
  .ikili b { font:700 1.3rem/1.2 var(--dar); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .gelir { color:var(--gelir); } .gider { color:var(--gider); }
  .oran { margin-top:14px; }
  .oran .ray { height:8px; background:var(--cizgi); border-radius:4px; overflow:hidden; }
  .oran .dolu { height:100%; background:var(--murekkep); }
  .oran.asim .dolu { background:var(--gider); }
  .oran p { margin:6px 0 0; font-size:.9rem; color:var(--soluk); }

  /* Kayıt formu */
  .tur { display:grid; grid-template-columns:1fr 1fr; border:1.5px solid var(--murekkep); border-radius:10px; overflow:hidden; margin-bottom:12px; }
  .tur button { min-height:44px; font:700 1.05rem/1 var(--dar); }
  .tur button[aria-pressed="true"] { background:var(--murekkep); color:var(--kagit); }
  form.kayit { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  form.kayit .tam { grid-column:1 / -1; }
  input, select, textarea { width:100%; min-width:0; min-height:46px; padding:10px 12px; border:1.5px solid var(--cizgi); border-radius:10px;
           background:transparent; color:inherit; font:inherit; font-size:1rem; }
  input:focus, select:focus, textarea:focus { border-color:var(--murekkep); outline:none; }
  select option { color:#000; }
  #amount { font:700 1.35rem/1 var(--dar); font-variant-numeric:tabular-nums; }
  .cipler { display:flex; flex-wrap:wrap; gap:8px; }
  .cip { min-height:40px; padding:0 14px; border-radius:20px; border:1.5px solid var(--cizgi); font-size:.95rem; }
  .cip[aria-pressed="true"] { background:var(--murekkep); border-color:var(--murekkep); color:var(--kagit); font-weight:600; }

  /* Günlük not: çizgili defter sayfası */
  .gun { display:flex; align-items:center; gap:6px; flex:1 1 240px; }
  .gun button { flex:none; }
  .gun button { width:42px; min-height:42px; border:1.5px solid var(--cizgi); border-radius:10px; font-size:1.2rem; }
  .gun input { flex:1; width:auto; min-height:42px; padding:6px 8px; }
  .not + .not { margin-top:16px; }
  .not label { display:block; font:700 1rem/1.3 var(--dar); margin-bottom:6px; }
  .not textarea { display:block; resize:vertical; min-height:142px; border-radius:4px; padding:0 12px 0 46px; line-height:28px;
    background-image:linear-gradient(90deg, transparent 34px, var(--kenar) 34px, var(--kenar) 35.5px, transparent 35.5px),
                     repeating-linear-gradient(transparent 0 27px, var(--cizgi) 27px 28px);
    background-attachment:local; }
  .durum { font-size:.85rem; color:var(--gelir); min-height:1.2em; margin-top:4px; }
  .gecmis { margin-top:10px; border-top:1px solid var(--cizgi); padding-top:10px; }
  .gecmis summary { cursor:pointer; color:var(--soluk); min-height:32px; }
  .gecmis button { display:block; width:100%; text-align:left; padding:10px 0; border-bottom:1px solid var(--cizgi); }
  .gecmis button small { display:block; color:var(--soluk); }
  .gecmis button span { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* Kategori dökümü */
  .kat { display:grid; grid-template-columns:1fr auto; gap:2px 10px; margin-top:12px; font-size:.97rem; }
  .kat .tutar { font-variant-numeric:tabular-nums; font-weight:600; }
  .kat .ray { grid-column:1 / -1; height:8px; background:var(--cizgi); border-radius:4px; overflow:hidden; }
  .kat .dolu { height:100%; background:var(--murekkep); }
  .kat small { color:var(--soluk); }

  /* İşlem defteri */
  .gun-basi { display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-top:16px; padding-bottom:5px; border-bottom:2px solid var(--murekkep); font:700 1rem/1.2 var(--dar); }
  .gun-basi:first-child { margin-top:0; }
  .gun-basi span:last-child { font-variant-numeric:tabular-nums; color:var(--soluk); font-weight:600; }
  .satir { display:grid; grid-template-columns:1fr auto 40px; align-items:center; gap:8px; padding:9px 0; border-bottom:1px solid var(--cizgi); }
  .satir.yeni { animation:parla 1.2s ease-out; }
  @keyframes parla { from { background:color-mix(in srgb, var(--sari) 45%, transparent); } to { background:transparent; } }
  @media (prefers-reduced-motion: reduce) { .satir.yeni { animation:none; } }
  .satir .ne { min-width:0; }
  .satir .ne b { display:block; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .satir .ne small { color:var(--soluk); }
  .satir .etiket { display:inline-block; margin-right:6px; padding:0 6px; border:1px solid var(--cizgi); border-radius:4px; color:var(--murekkep); }
  .satir .tutar { font:700 1.1rem/1 var(--dar); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .satir .sil { width:40px; height:40px; color:var(--soluk); font-size:1.05rem; border-radius:8px; }
  .bos { color:var(--soluk); padding:14px 0 4px; }

  dialog { border:1px solid var(--cizgi); border-radius:10px; background:var(--kagit); color:var(--murekkep); padding:20px; width:min(92vw,380px); }
  dialog::backdrop { background:rgba(10,16,26,.55); }
  dialog h2 { margin-bottom:12px; }
  dialog p { color:var(--soluk); margin:0; }
  .dugmeler { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; flex-wrap:wrap; }
  .dugmeler .btn { padding:0 14px; }
  .dugmeler .tehlike { margin-right:auto; }
</style>
</head>
<body>
<main>
  <header class="ust">
    <h1>Harcama Takip</h1>
    <button id="install" class="btn ikincil kucuk" hidden>Telefona yükle</button>
  </header>

  <nav class="sekmeler" id="tabs" aria-label="Projeler"></nav>

  <section class="sayfa ilk" aria-label="Özet">
    <div class="baslik dar">
      <span class="bakiye-ad" id="balLabel">Bakiye</span>
      <button type="button" class="btn ikincil kucuk" id="editProj" hidden>Projeyi düzenle</button>
    </div>
    <div class="bakiye" id="bal">₺0,00</div>
    <div class="ikili">
      <div><small>Gelir</small><b id="inc" class="gelir">₺0,00</b></div>
      <div><small>Gider</small><b id="exp" class="gider">₺0,00</b></div>
    </div>
    <div class="oran" id="ratio" hidden>
      <div class="ray"><div class="dolu" id="ratioFill"></div></div>
      <p id="ratioText"></p>
    </div>
  </section>

  <section class="sayfa" aria-label="Yeni kayıt">
    <div class="tur" role="group" aria-label="Kayıt türü">
      <button type="button" id="turGider" aria-pressed="true">Gider</button>
      <button type="button" id="turGelir" aria-pressed="false">Gelir</button>
    </div>
    <form id="form" class="kayit">
      <input id="desc" class="tam" placeholder="Ne için? Örn. çimento, usta yevmiyesi" aria-label="Açıklama" required>
      <input id="amount" class="tam" type="number" step="0.01" min="0.01" inputmode="decimal" placeholder="Tutar (₺)" aria-label="Tutar" required>
      <div class="cipler tam" id="cats" role="group" aria-label="Kategori"></div>
      <select id="proj" aria-label="Proje"></select>
      <input id="date" type="date" aria-label="Tarih" required>
      <button class="btn tam" id="submit">Gider ekle</button>
    </form>
  </section>

  <section class="sayfa" aria-label="Günlük not">
    <div class="baslik">
      <h2>Günlük not</h2>
      <div class="gun">
        <button type="button" id="prevDay" aria-label="Önceki gün">‹</button>
        <input type="date" id="noteDate" aria-label="Not tarihi">
        <button type="button" id="nextDay" aria-label="Sonraki gün">›</button>
      </div>
    </div>
    <div id="notes"></div>
    <details class="gecmis" id="histBox">
      <summary>Geçmiş notlar</summary>
      <div id="hist"></div>
    </details>
  </section>

  <section class="sayfa" aria-label="Giderlerin dağılımı">
    <h2>Giderler nereye gitti</h2>
    <div id="bars"></div>
  </section>

  <section class="sayfa" aria-label="İşlemler">
    <div class="baslik"><h2>İşlemler</h2></div>
    <div id="rows"></div>
  </section>
</main>

<dialog id="projDlg">
  <form method="dialog" id="projForm">
    <h2 id="projTitle">Yeni proje</h2>
    <input id="projName" placeholder="Örn. 1. İnşaat" maxlength="40" aria-label="Proje adı" required>
    <div class="dugmeler">
      <button type="button" class="btn tehlike" id="projDel" hidden>Projeyi sil</button>
      <button type="button" class="btn ikincil" id="projCancel">Vazgeç</button>
      <button class="btn" id="projSave">Kaydet</button>
    </div>
  </form>
</dialog>

<dialog id="confirmDlg">
  <h2>Proje silinsin mi?</h2>
  <p id="confirmText"></p>
  <div class="dugmeler">
    <button type="button" class="btn ikincil" id="confirmNo">Vazgeç</button>
    <button type="button" class="btn tehlike" id="confirmYes">Projeyi sil</button>
  </div>
</dialog>

<script>
  const KEY = 'harcamalar', PKEY = 'ht_projeler', NKEY = 'ht_notlar', AKEY = 'ht_aktif';
  const CATS = [['malzeme', 'Malzeme'], ['işçilik', 'İşçilik'], ['nakliye', 'Nakliye'], ['market', 'Market'], ['fatura', 'Fatura'],
                ['ulaşım', 'Ulaşım'], ['eğlence', 'Eğlence'], ['sağlık', 'Sağlık'], ['diğer', 'Diğer']];
  const catName = c => c === 'gelir' ? 'Gelir' : ((CATS.find(x => x[0] === c) || [])[1] || c);
  const $ = id => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const money = n => (n < 0 ? '−' : '') + '₺' + Math.abs(n).toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } };
  const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  const pad = n => String(n).padStart(2, '0');
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const fromYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
  const trDate = s => fromYmd(s).toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', weekday: 'long' });

  let items = load(KEY, []);
  let projects = load(PKEY, null);
  let notes = load(NKEY, {});
  let active = load(AKEY, 'all');
  let kind = 'gider', cat = 'malzeme', lastAdded = null;
  if (!Array.isArray(items)) items = [];
  if (!Array.isArray(projects) || !projects.length) projects = [{ id: 'genel', name: 'Genel' }];
  if (!notes || typeof notes !== 'object') notes = {};

  // Eski kayıtları (proje alanı olmayan) ilk projeye bağla
  let migrated = false;
  items.forEach(i => { if (!projects.some(p => p.id === i.proj)) { i.proj = projects[0].id; migrated = true; } });
  if (active !== 'all' && !projects.some(p => p.id === active)) active = 'all';
  store(PKEY, projects);
  if (migrated) store(KEY, items);

  const saveItems = () => store(KEY, items);
  const projName = id => (projects.find(p => p.id === id) || {}).name || '';
  const visible = () => active === 'all' ? projects : projects.filter(p => p.id === active);

  function setActive(id) {
    active = id; store(AKEY, active);
    if (id !== 'all') $('proj').value = id;
    render();
  }

  function setKind(k) {
    kind = k;
    $('turGider').setAttribute('aria-pressed', k === 'gider');
    $('turGelir').setAttribute('aria-pressed', k === 'gelir');
    $('cats').hidden = k === 'gelir';
    $('submit').textContent = k === 'gelir' ? 'Gelir ekle' : 'Gider ekle';
    $('desc').placeholder = k === 'gelir' ? 'Nereden? Örn. hakediş, avans' : 'Ne için? Örn. çimento, usta yevmiyesi';
  }
  $('turGider').onclick = () => setKind('gider');
  $('turGelir').onclick = () => setKind('gelir');

  function renderCats() {
    const box = $('cats');
    box.innerHTML = '';
    CATS.forEach(([id, name]) => {
      const b = el('button', 'cip', name);
      b.type = 'button'; b.dataset.cat = id;
      b.setAttribute('aria-pressed', id === cat);
      b.onclick = () => { cat = id; renderCats(); };
      box.append(b);
    });
  }

  function renderTabs() {
    const tabs = $('tabs');
    const left = tabs.scrollLeft;
    tabs.innerHTML = '';
    const mk = (label, cls, fn) => { const b = el('button', 'sekme ' + cls, label); b.type = 'button'; b.onclick = fn; tabs.append(b); };
    mk('Tümü', active === 'all' ? 'secili' : '', () => setActive('all'));
    projects.forEach(p => mk(p.name, active === p.id ? 'secili' : '', () => setActive(p.id)));
    mk('+ Proje', 'yeni', () => openProj(null));
    tabs.scrollLeft = left;
    const on = tabs.querySelector('.secili');
    if (on) {
      if (on.offsetLeft < tabs.scrollLeft) tabs.scrollLeft = on.offsetLeft - 8;
      else if (on.offsetLeft + on.offsetWidth > tabs.scrollLeft + tabs.clientWidth) tabs.scrollLeft = on.offsetLeft + on.offsetWidth - tabs.clientWidth + 8;
    }

    const sel = $('proj'), cur = sel.value;
    sel.innerHTML = '';
    projects.forEach(p => { const o = el('option', '', p.name); o.value = p.id; sel.append(o); });
    sel.value = active !== 'all' ? active : (projects.some(p => p.id === cur) ? cur : projects[0].id);
    $('editProj').hidden = active === 'all';
    $('balLabel').textContent = active === 'all' ? 'Tüm projelerin bakiyesi' : projName(active) + ' bakiyesi';
  }

  function renderNotes() {
    const day = $('noteDate').value;
    const box = $('notes');
    box.innerHTML = '';
    visible().forEach(p => {
      const wrap = el('div', 'not');
      const key = p.id + '|' + day;
      const lab = el('label', '', `${p.name}, ${trDate(day)}`);
      const ta = el('textarea');
      ta.id = 'not-' + p.id; lab.htmlFor = ta.id;
      ta.placeholder = 'Bugün ne yapıldı? Gelen malzeme, çalışan usta, yarın yapılacaklar';
      ta.value = notes[key] || '';
      const st = el('div', 'durum');
      st.setAttribute('aria-live', 'polite');
      let t;
      ta.oninput = () => {
        const v = ta.value;
        if (v.trim()) notes[key] = v; else delete notes[key];
        store(NKEY, notes);
        st.textContent = 'Kaydedildi';
        clearTimeout(t);
        t = setTimeout(() => { st.textContent = ''; renderHist(); }, 1200);
      };
      wrap.append(lab, ta, st);
      box.append(wrap);
    });
    renderHist();
  }

  function renderHist() {
    const ids = new Set(visible().map(p => p.id));
    const list = Object.entries(notes)
      .map(([k, text]) => { const n = k.lastIndexOf('|'); return { proj: k.slice(0, n), day: k.slice(n + 1), text }; })
      .filter(n => ids.has(n.proj))
      .sort((a, b) => b.day.localeCompare(a.day) || projName(a.proj).localeCompare(projName(b.proj), 'tr'));
    const hist = $('hist');
    hist.innerHTML = '';
    $('histBox').querySelector('summary').textContent = `Geçmiş notlar (${list.length})`;
    if (!list.length) { hist.append(el('div', 'bos', 'Not yazdıkça burada birikir.')); return; }
    list.slice(0, 60).forEach(n => {
      const b = el('button');
      b.type = 'button';
      b.append(el('small', '', `${trDate(n.day)}, ${projName(n.proj)}`), el('span', '', n.text));
      b.onclick = () => { $('noteDate').value = n.day; renderNotes(); $('noteDate').scrollIntoView({ block: 'center' }); };
      hist.append(b);
    });
  }

  function render() {
    renderTabs();
    const shown = active === 'all' ? items : items.filter(i => i.proj === active);
    const inc = shown.filter(i => i.cat === 'gelir').reduce((s, i) => s + i.amount, 0);
    const exp = shown.filter(i => i.cat !== 'gelir').reduce((s, i) => s + i.amount, 0);
    $('bal').textContent = money(inc - exp);
    $('bal').classList.toggle('eksi', inc - exp < 0);
    $('inc').textContent = money(inc);
    $('exp').textContent = money(exp);

    const ratio = $('ratio');
    ratio.hidden = !(inc > 0);
    if (inc > 0) {
      ratio.classList.toggle('asim', exp > inc);
      $('ratioFill').style.width = Math.min(100, exp / inc * 100) + '%';
      $('ratioText').textContent = exp > inc
        ? `Gider, geliri ${money(exp - inc)} aştı.`
        : `Gelirin yüzde ${Math.round(exp / inc * 100)} kadarı harcandı.`;
    }

    const byCat = {};
    shown.filter(i => i.cat !== 'gelir').forEach(i => byCat[i.cat] = (byCat[i.cat] || 0) + i.amount);
    const bars = $('bars');
    bars.innerHTML = '';
    Object.entries(byCat).sort((a, b) => b[1] - a[1]).forEach(([c, sum]) => {
      const row = el('div', 'kat');
      const name = el('span', '', catName(c) + ' ');
      const pct = Math.round(sum / exp * 100);
      name.append(el('small', '', pct < 1 ? '%1’den az' : '%' + pct));
      const track = el('div', 'ray'), fill = el('div', 'dolu');
      fill.style.width = (sum / exp * 100) + '%';
      track.append(fill);
      row.append(name, el('span', 'tutar', money(sum)), track);
      bars.append(row);
    });
    if (!Object.keys(byCat).length) bars.append(el('div', 'bos', 'İlk gideri ekleyince dağılım burada görünür.'));

    const rows = $('rows');
    rows.innerHTML = '';
    const sorted = [...shown].sort((a, b) => b.date - a.date || b.id - a.id);
    let lastDay = null;
    sorted.forEach(i => {
      const day = ymd(new Date(i.date));
      if (day !== lastDay) {
        lastDay = day;
        const dayExp = sorted.filter(x => ymd(new Date(x.date)) === day && x.cat !== 'gelir').reduce((s, x) => s + x.amount, 0);
        const head = el('div', 'gun-basi');
        head.append(el('span', '', trDate(day)), el('span', '', dayExp ? 'Gider ' + money(dayExp) : ''));
        rows.append(head);
      }
      const isInc = i.cat === 'gelir';
      const row = el('div', 'satir' + (i.id === lastAdded ? ' yeni' : ''));
      const what = el('div', 'ne');
      const meta = el('small');
      if (active === 'all' && projects.length > 1) meta.append(el('span', 'etiket', projName(i.proj)));
      meta.append(catName(i.cat));
      what.append(el('b', '', i.desc), meta);
      const del = el('button', 'sil', '✕');
      del.type = 'button'; del.title = 'Sil'; del.setAttribute('aria-label', i.desc + ' kaydını sil');
      del.onclick = () => { items = items.filter(x => x.id !== i.id); saveItems(); render(); };
      row.append(what, el('span', 'tutar ' + (isInc ? 'gelir' : 'gider'), (isInc ? '+' : '−') + money(i.amount)), del);
      rows.append(row);
    });
    lastAdded = null;
    if (!shown.length) rows.append(el('div', 'bos', 'Henüz kayıt yok. Yukarıdan ilk gideri ya da geliri ekleyin.'));

    renderNotes();
  }

  $('form').onsubmit = e => {
    e.preventDefault();
    const amount = parseFloat($('amount').value);
    if (!(amount > 0)) return;
    const day = $('date').value || ymd(new Date());
    const id = Date.now();
    items.push({ id, desc: $('desc').value.trim(), amount, cat: kind === 'gelir' ? 'gelir' : cat, proj: $('proj').value, date: fromYmd(day).getTime() });
    lastAdded = id;
    saveItems();
    $('desc').value = ''; $('amount').value = '';
    render();
  };

  // Günlük not tarihi
  const shiftDay = n => { const d = fromYmd($('noteDate').value); d.setDate(d.getDate() + n); $('noteDate').value = ymd(d); renderNotes(); };
  $('prevDay').onclick = () => shiftDay(-1);
  $('nextDay').onclick = () => shiftDay(1);
  $('noteDate').onchange = () => { if (!$('noteDate').value) $('noteDate').value = ymd(new Date()); renderNotes(); };

  // Proje ekleme / düzenleme / silme
  let editing = null;
  function openProj(id) {
    editing = id;
    $('projTitle').textContent = id ? 'Projeyi düzenle' : 'Yeni proje';
    $('projName').value = id ? projName(id) : '';
    $('projDel').hidden = !id || projects.length < 2;
    $('projDlg').showModal();
    $('projName').focus();
  }
  $('editProj').onclick = () => openProj(active);
  $('projCancel').onclick = () => $('projDlg').close();
  $('projForm').onsubmit = e => {
    e.preventDefault();
    const name = $('projName').value.trim();
    if (!name) return;
    if (editing) {
      projects.find(p => p.id === editing).name = name;
    } else {
      const id = 'p' + Date.now();
      projects.push({ id, name });
      active = id; store(AKEY, active);
    }
    store(PKEY, projects);
    $('projDlg').close();
    render();
  };
  $('projDel').onclick = () => {
    const n = items.filter(i => i.proj === editing).length;
    const m = Object.keys(notes).filter(k => k.startsWith(editing + '|')).length;
    $('confirmText').textContent = `"${projName(editing)}" projesi, ${n} işlemi ve ${m} notuyla birlikte kalıcı olarak silinecek.`;
    $('projDlg').close();
    $('confirmDlg').showModal();
  };
  $('confirmNo').onclick = () => $('confirmDlg').close();
  $('confirmYes').onclick = () => {
    items = items.filter(i => i.proj !== editing);
    Object.keys(notes).forEach(k => { if (k.startsWith(editing + '|')) delete notes[k]; });
    projects = projects.filter(p => p.id !== editing);
    saveItems(); store(NKEY, notes); store(PKEY, projects);
    $('confirmDlg').close();
    setActive('all');
  };

  // Telefona kurulum (PWA)
  let deferred;
  addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; $('install').hidden = false; });
  $('install').onclick = async () => { if (!deferred) return; deferred.prompt(); await deferred.userChoice; deferred = null; $('install').hidden = true; };
  addEventListener('appinstalled', () => { $('install').hidden = true; });
  if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

  $('date').value = $('noteDate').value = ymd(new Date());
  renderCats();
  render();
</script>
</body>
</html>
