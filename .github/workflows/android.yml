name: Android APK

on:
  push:
    branches: [main, proje-kartlari]
    tags: ["apk-v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK derle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: APK derle
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee build.log

      - name: Hata özeti
        if: failure()
        run: |
          msg=$(grep -E -A8 "What went wrong|error:|e: |FAILED|Could not" build.log | grep -v "^\s*at " | head -70 || true)
          msg="${msg//'%'/'%25'}"
          msg="${msg//$'\r'/}"
          msg="${msg//$'\n'/'%0A'}"
          echo "::error title=Gradle::${msg:-build.log bos}"

      - name: APK dosyasını adlandır
        run: cp app/build/outputs/apk/release/app-release.apk ../harcama-takip.apk

      - uses: actions/upload-artifact@v4
        with:
          name: harcama-takip-apk
          path: harcama-takip.apk
          if-no-files-found: error

      - name: Sürüm yayınla
        if: startsWith(github.ref, 'refs/tags/apk-v')
        uses: softprops/action-gh-release@v2
        with:
          files: harcama-takip.apk
          body: |
            Harcama Takip Android uygulaması. `harcama-takip.apk` dosyasını telefona indirip açın; "bilinmeyen kaynaklardan yükleme" izni istenirse verin.
